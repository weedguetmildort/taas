
services:
  db:
    image: mysql:8.0
    container_name: taas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-taas_local}
      MYSQL_USER: ${DB_USER:-taas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-taas_local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - target: 3306
        published: "${DB_PORT:-3307}"
        host_ip: "${DB_BIND_IP:-127.0.0.1}"
        protocol: tcp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root_local_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Unpacks dev/ufl-assets.tar.gz (UF theme and plugins) into the gitignored
  # htdocs/wp-content paths mounted into wordpress, before it starts. Skips
  # when the archive is unchanged; bin/pack-ufl-assets.sh rebuilds it.
  ufl-assets:
    image: alpine:3.20
    container_name: taas-ufl-assets
    volumes:
      - ./dev:/assets:ro
      - ./htdocs/wp-content:/wp-content
    command:
      - sh
      - -ec
      - |
        archive=/assets/ufl-assets.tar.gz
        marker=/wp-content/.ufl-assets.sha256
        dirs="themes/ufl-main-uni themes/ufl-main-uni-child-main plugins/advanced-custom-fields plugins/ufl-block plugins/section-nav"
        if [ ! -f "$$archive" ]; then
          echo "No $$archive, skipping"
          exit 0
        fi
        sum=$$(sha256sum "$$archive" | cut -d ' ' -f 1)
        if [ "$$(cat "$$marker" 2>/dev/null)" = "$$sum" ] && [ -f /wp-content/themes/ufl-main-uni-child-main/style.css ]; then
          echo "UF assets up to date"
          exit 0
        fi
        # Empty the folders rather than removing them: they are bind-mount sources
        for d in $$dirs; do
          mkdir -p "/wp-content/$$d"
          find "/wp-content/$$d" -mindepth 1 -delete
        done
        tar -xzf "$$archive" -C /wp-content
        echo "$$sum" > "$$marker"
        echo "UF assets unpacked"

  wordpress:
    image: wordpress:7.1-php8.2-apache
    container_name: taas-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ufl-assets:
        condition: service_completed_successfully
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-taas_local}
      WORDPRESS_DB_USER: ${DB_USER:-taas}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-taas_local_password}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        if ( ! defined( 'WP_DEBUG' ) ) { define( 'WP_DEBUG', true ); }
        if ( ! defined( 'WP_DEBUG_LOG' ) ) { define( 'WP_DEBUG_LOG', true ); }
        if ( ! defined( 'WP_DEBUG_DISPLAY' ) ) { define( 'WP_DEBUG_DISPLAY', false ); }
        define( 'SCRIPT_DEBUG', true );
        define( 'TAAS_LOCAL_DEV', true );
        define( 'TAAS_LOCAL_DEV_USER', '${TAAS_LOCAL_DEV_USER:-student}' );
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./htdocs/wp-content/plugins/taas-core:/var/www/html/wp-content/plugins/taas-core
      - ./htdocs/wp-content/plugins/taas-student-application-page:/var/www/html/wp-content/plugins/taas-student-application-page
      # Uncomment each of these once the plugin exists
      # - ./htdocs/wp-content/plugins/taas-onboarding:/var/www/html/wp-content/plugins/taas-onboarding
      # - ./htdocs/wp-content/plugins/taas-matching:/var/www/html/wp-content/plugins/taas-matching
      # - ./htdocs/wp-content/plugins/taas-frontend:/var/www/html/wp-content/plugins/taas-frontend
      # UF theme and the plugins it needs: gitignored local copies (see README)
      - ./htdocs/wp-content/themes/ufl-main-uni:/var/www/html/wp-content/themes/ufl-main-uni
      - ./htdocs/wp-content/themes/ufl-main-uni-child-main:/var/www/html/wp-content/themes/ufl-main-uni-child-main
      - ./htdocs/wp-content/plugins/advanced-custom-fields:/var/www/html/wp-content/plugins/advanced-custom-fields
      - ./htdocs/wp-content/plugins/ufl-block:/var/www/html/wp-content/plugins/ufl-block
      - ./htdocs/wp-content/plugins/section-nav:/var/www/html/wp-content/plugins/section-nav
      # Repo root, outside the web root, for bin/, vendor/ and snapshots/
      - .:/var/www/taas

volumes:
  db_data:
  wp_data:
