name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # Filter inside the workflow rather than with on.paths, so a skipped run
  # still reports a status and never blocks a required check on a docs-only PR.
  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    outputs:
      php: ${{ steps.filter.outputs.php }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            php:
              - 'htdocs/wp-content/plugins/taas-*/**'
              - 'bin/**'
              - 'tests/**'
              - 'composer.json'
              - 'composer.lock'
              - 'phpcs.xml.dist'
              - 'phpunit.xml.dist'
              - '.github/workflows/ci.yml'

  test:
    name: Lint/Test
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check version consistency
        run: php bin/check-version.php

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php82-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php82-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHP_CodeSniffer
        run: composer run lint

      - name: Run PHPUnit
        run: composer run test
