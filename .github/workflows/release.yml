name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Draft Release
    runs-on: ubuntu-26.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify version matches the tag
        run: php bin/check-version.php "${{ github.ref_name }}"

      # Prod deploys by checking out the tag, so there is nothing to build or
      # upload. The release exists to label the tag and record what changed.
      - name: Create a draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Severity:** _set one before publishing_ — `breaking` / `feature` / `fix`

            Because the version scheme has no patch segment, severity is not
            derivable from the version number. State it here.

            | | |
            |---|---|
            | Tag | `${{ github.ref_name }}` |
            | Baseline | WordPress 7.x, PHP 8.x, MySQL 8.x, Apache 2.x |

            ### Deploying

            On `az1-apacheint-prod01.server.ufl.edu`:

            ```sh
            cd /h/cnswww-taas.cise/taas.cise.ufl.edu
            git fetch --tags
            git status --short    # must print nothing
            git checkout ${{ github.ref_name }}
            ```

            Never run `git clean -x` on the server: the ignored files are
            WordPress core, `wp-config.php`, uploads and third-party plugins.
            Notify IT before deploying so Sucuri's file-change alerts are expected.
