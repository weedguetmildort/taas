name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build/Release
    runs-on: ubuntu-26.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Verify version matches the tag
        run: php bin/check-version.php "${{ github.ref_name }}"

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: Compute the full version
        id: version
        run: |
          BASELINE="${GITHUB_REF_NAME#v}"
          BUILD="${{ github.run_number }}"
          echo "full=${BASELINE}.${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Building ${BASELINE}.${BUILD}"

      - name: Inject the build number
        env:
          FULL: ${{ steps.version.outputs.full }}
        run: |
          # Rewrite the trailing .0 build segment in both places it appears.
          sed -i -E "s/^( \* Version: +).*/\1${FULL}/" taas-core.php
          sed -i -E "s/(define\( 'TAAS_CORE_VERSION', ')[^']*(' \);)/\1${FULL}\2/" taas-core.php
          grep -n "Version:\|TAAS_CORE_VERSION" taas-core.php

      - name: Stage the plugin folder
        env:
          FULL: ${{ steps.version.outputs.full }}
        run: |
          # WordPress expects the plugin folder nested inside the zip, so the
          # archive root must be taas-core/, not the files loose.
          mkdir -p build/taas-core
          rsync -a ./ build/taas-core/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude 'tests' \
            --exclude 'bin' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude 'docker-compose.yml' \
            --exclude 'phpunit.xml.dist' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude '.phpunit.result.cache' \
            --exclude '*.zip'
          cd build
          zip -rq "taas-core-${FULL}.zip" taas-core
          sha256sum "taas-core-${FULL}.zip" > "taas-core-${FULL}.zip.sha256"
          ls -la

      - name: Upload the build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ci-build-taas-core-${{ steps.version.outputs.full }}
          path: |
            build/*.zip
            build/*.sha256

      - name: Create a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ steps.version.outputs.full }}
          body: |
            **Severity:** _set one before publishing_ — `breaking` / `feature` / `fix`

            Because the version scheme has no patch segment, severity is not
            derivable from the version number. State it here.

            | | |
            |---|---|
            | Version | `${{ steps.version.outputs.full }}` |
            | Baseline | WordPress 7.x, PHP 8.x, MySQL 8.x, Apache 2.x |
            | Build | `${{ github.run_number }}` |

            ### Changes

            _summarise here_

            ### Deploying

            1. Download `taas-core-${{ steps.version.outputs.full }}.zip` below
            2. Verify the checksum against the `.sha256` file
            3. Upload via Plugins → Add New → Upload Plugin on `taas.cise.ufl.edu`
            4. Notify IT if Sucuri flags the file change
          files: |
            build/*.zip
            build/*.sha256
