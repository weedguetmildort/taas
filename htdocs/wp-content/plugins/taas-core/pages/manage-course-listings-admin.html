<!-- wp:html -->
<style data-wp-block-html="css">
/* MAIN WHITE CARD */

.manage-courses-container {
    width: 95%;
    max-width: 1400px;
    margin: 30px auto;
    padding: 40px;

    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);

    font-family: Arial, sans-serif;
    color: #222;
    box-sizing: border-box;
}

/* HEADER */

.manage-courses-header {
    margin-bottom: 35px;
}

.manage-courses-header h2 {
    font-size: 27px;
    font-weight: 600;
    margin: 0;
    color: #222;
}

/* TABLE SECTION */

.manage-courses-section {
    width: 100%;
}

.manage-courses-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 20px;
}

.manage-courses-title h3 {
    font-size: 19px;
    font-weight: 600;
    margin: 0;
}

.course-header-actions,
.course-student-filter {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
}

.course-header-actions {
    justify-content: flex-end;
    gap: 18px;
}

.course-student-filter {
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
}

.course-student-filter select {
    min-width: 155px;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background-color: #fff;
    color: #222;
    font: inherit;
    font-weight: 400;
    cursor: pointer;
}

.course-row-actions,
.course-edit-actions {
    display: flex;
    gap: 8px;
}

.course-edit-dialog {
    width: min(520px, 90vw);
    max-height: 85vh;
    padding: 24px;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-sizing: border-box;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.24);
}

.course-edit-dialog::backdrop {
    background: rgba(0, 0, 0, 0.42);
}

.course-edit-dialog form {
    display: grid;
    gap: 12px;
}

.course-edit-dialog label {
    display: block;
}

.course-edit-dialog input:not([type="checkbox"]),
.course-edit-dialog select,
.course-edit-dialog textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font: inherit;
}

.course-edit-dialog fieldset {
    margin: 0;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

/* ADD COURSE BUTTON */

.add-course-button {
    padding: 12px 20px;
    background: #ff7f11;
    color: #ffffff;

    border: none;
    border-radius: 4px;

    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}

.add-course-button:hover {
    background: #e66f08;
}

/* TABLE WRAPPER */

.manage-courses-table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #eee;
    border-radius: 4px;
    box-sizing: border-box;
}

/* TABLE */

.manage-courses-table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
    text-align: left;
    font-size: 14px;
}

/* TABLE HEADERS */

.manage-courses-table th {
    padding: 15px 12px;

    background: #f1f1f1;
    border-bottom: 2px solid #ddd;

    font-size: 14px;
    font-weight: 600;
    color: #222;
    line-height: 1.35;
}

/* TABLE CELLS */

.manage-courses-table td {
    padding: 15px 12px;
    border-bottom: 2px solid #ffffff;
    vertical-align: middle;
    line-height: 1.5;
}

/* ALTERNATING ROW COLORS */

.manage-courses-table tbody tr:nth-child(odd) {
    background: #f5f5f5;
}

.manage-courses-table tbody tr:nth-child(even) {
    background: #ffffff;
}

.manage-courses-table tbody tr:hover {
    background: #e8f1f8;
}

.manage-courses-table td:nth-child(4) {
    overflow-wrap: anywhere;
}

.edit-course-button,
.delete-course-button,
.course-edit-actions button {
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: 4px;
    font: 500 13px Arial, sans-serif;
    cursor: pointer;
    white-space: nowrap;
}

.edit-course-button,
.course-edit-actions button[type="submit"] {
    background: #0021a5;
    color: #fff;
}

.edit-course-button:hover,
.course-edit-actions button[type="submit"]:hover {
    background: #00166e;
}

.delete-course-button {
    border-color: #b42318;
    background: #fff;
    color: #b42318;
}

.delete-course-button:hover {
    background: #fff0ee;
}

.course-edit-actions button[type="button"] {
    border-color: #ccc;
    background: #fff;
    color: #222;
}

.manage-courses-container button:disabled {
    opacity: 0.6;
    cursor: default;
}

/* KEYBOARD ACCESSIBILITY */

.manage-courses-container button:focus-visible,
.manage-courses-container input:focus-visible,
.manage-courses-container select:focus-visible,
.manage-courses-container textarea:focus-visible {
    outline: 3px solid #0021a5;
    outline-offset: 3px;
}

/* MOBILE */

@media (max-width: 768px) {

    .manage-courses-container {
        width: 95%;
        padding: 20px;
    }

    .manage-courses-header h2 {
        font-size: 24px;
    }

    .manage-courses-title {
        flex-direction: column;
        align-items: flex-start;
    }

    .course-header-actions {
        justify-content: flex-start;
    }
}

/* ADD COURSE XLSX UPLOAD */

#course-upload-status {
    overflow-wrap: anywhere;
}

.manage-courses-container [role="status"]:empty {
    margin: 0;
}

</style>

<div class="manage-courses-container" data-manage-courses>
    <div class="manage-courses-header">
        <h2>Manage Course Listings</h2>
    </div>

    <div class="manage-courses-section">
        <div class="manage-courses-title">
            <h3 id="course-list-heading" data-course-list-term>Current Course Listings</h3>

            <div class="course-header-actions">
                <div class="course-student-filter">
                    <label for="course-student-type">Student Type</label>
                    <select id="course-student-type">
                        <option value="all">All Students</option>
                        <option value="1">Undergraduate Students</option>
                        <option value="2">Master’s Students</option>
                        <option value="4">PhD Students</option>
                    </select>
                </div>

                <form id="upload-course-xlsx">
                    <input type="file" id="course-xlsx-file" name="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
                    <button type="button" id="upload-course-xlsx-button" class="add-course-button">+ Add Course</button>
                </form>
            </div>
        </div>

        <div id="course-upload-status" role="status" aria-live="polite"></div>
        <p data-course-list-status role="status"></p>
        <p data-course-action-status role="status"></p>
        <div class="manage-courses-table-wrapper" hidden>
            <table class="manage-courses-table" aria-labelledby="course-list-heading">
                <thead>
                    <tr>
                        <th scope="col">Course Name</th>
                        <th scope="col">Course Number</th>
                        <th scope="col">Professor Name</th>
                        <th scope="col">Professor Email</th>
                        <th scope="col">Maximum Enrollment</th>
                        <th scope="col">Current Enrollment</th>
                        <th scope="col">Lab Hours</th>
                        <th scope="col">Delivery Mode</th>
                        <th scope="col">Eligible Student Types</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <dialog class="course-edit-dialog" data-course-editor aria-labelledby="course-edit-heading">
        <form>
            <h3 id="course-edit-heading">Edit Course</h3>
            <label>Course Name <input name="course_name" maxlength="255" required></label>
            <label>Course Number <input name="course_code" maxlength="20" required></label>
            <label>Professor <select name="professor_id" required></select></label>
            <label>Maximum Enrollment <input type="number" name="max_enrollment" min="0" max="2147483647" required></label>
            <label>Current Enrollment <input type="number" name="enrollment" min="0" max="2147483647" required></label>
            <label>Lab Hours
                <select name="lab_hours">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </label>
            <label><input type="checkbox" name="is_online"> Online</label>
            <label>Description <textarea name="course_description" maxlength="1000" rows="3"></textarea></label>
            <fieldset>
                <legend>Eligible Student Types</legend>
                <label><input type="checkbox" name="eligible_student_types" value="1"> Undergraduate Students</label>
                <label><input type="checkbox" name="eligible_student_types" value="2"> Master’s Students</label>
                <label><input type="checkbox" name="eligible_student_types" value="4"> PhD Students</label>
            </fieldset>
            <p data-course-edit-status role="status"></p>
            <div class="course-edit-actions">
                <button type="submit">Save Changes</button>
                <button type="button" data-course-edit-cancel>Cancel</button>
            </div>
        </form>
    </dialog>
</div>
<!-- /wp:html -->
