<script>
(function () {

    function initializeStudentDownload() {

        const downloadButton =
            document.getElementById("download-student-data");

        if (!downloadButton) return;

        downloadButton.addEventListener("click", function () {

            // SAMPLE STUDENT DATA
            // Replace with database results later.

            const students = [
                {
                    name: "Jane Doe",
                    email: "jane@example.edu",
                    studentType: "PhD",
                    course: "COP3502C",
                    gpa: "3.9",
                    hours: "15",
                    status: "Submitted",
                    hr: "Approved"
                },
                {
                    name: "John Smith",
                    email: "john@example.edu",
                    studentType: "Masters",
                    course: "COP3530",
                    gpa: "3.8",
                    hours: "10",
                    status: "Submitted",
                    hr: "Not Approved"
                },
                {
                    name: "Leonardo Rey",
                    email: "leonardo@example.edu",
                    studentType: "Undergraduate",
                    course: "CIS4301",
                    gpa: "3.7",
                    hours: "12",
                    status: "Submitted",
                    hr: "Approved"
                },
                {
                    name: "Emily Davis",
                    email: "emily@example.edu",
                    studentType: "PhD",
                    course: "COP4600",
                    gpa: "3.8",
                    hours: "20",
                    status: "Submitted",
                    hr: "Approved"
                }
            ];

            // CSV COLUMN HEADERS
            const headers = [
                "Student Name",
                "Email",
                "Student Type",
                "Course Number",
                "GPA",
                "Available Hours",
                "Application Status",
                "HR Approval Status"
            ];

            // ESCAPE CSV VALUES SAFELY
            function escapeCSV(value) {
                const text = String(value ?? "");

                return '"' +
                    text.replace(/"/g, '""') +
                    '"';
            }

            // BUILD CSV CONTENT
           
const rows = students.map(function (student) {

    // Remove spaces and standardize course numbers
    const formattedCourse = String(student.course)
        .replace(/\s+/g, "")
        .toUpperCase();

    return [
        student.name,
        student.email,
        student.studentType,
        formattedCourse,
        student.gpa,
        student.hours,
        student.status,
        student.hr
    ].map(escapeCSV).join(",");

});


            const csvContent =
                [headers.map(escapeCSV).join(","), ...rows]
                    .join("\r\n");

            // CREATE CSV FILE
            const blob = new Blob(
                ["\uFEFF" + csvContent],
                { type: "text/csv;charset=utf-8;" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = "TA_Student_Applications_SAMPLE.csv";

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

            // CLEAN UP
            setTimeout(function () {
                URL.revokeObjectURL(url);
            }, 1000);

        });

    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            initializeStudentDownload
        );
    } else {
        initializeStudentDownload();
    }

})();
</script>
