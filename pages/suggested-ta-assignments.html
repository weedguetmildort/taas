<div style="
    max-width: 1000px;
    margin: 40px auto 60px auto;
    padding: 45px 55px;
    background: white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.14);
    box-sizing: border-box;
    font-family: Arial, sans-serif;
">

    <!-- TITLE -->
    <h2 style="
        color: #0021A5;
        font-size: 34px;
        font-weight: 700;
        margin: 0 0 50px 0;

        Suggested TA Assignments
    </h2>

        </thead>

        <tbody>

            <tr style="border-bottom: 1px solid #e5e5e5;">

                           name="selected_tas[]"

                </td>
                <td style="padding:13px 8px;font-weight:bold;">#2</td>
                <td style="padding:13px 8px;">Emily</td>
                <td style="padding:13px 8px;">Computer Science</td>
                <td style="padding:13px 8px;">3.8</td>
                <td style="padding:13px 8px;">COP6767</td>
                <td style="padding:13px 8px;">Yes</td>
                <td style="padding:13px 8px;">Yes</td>
            </tr>

            <tr style="border-bottom: 1px solid #e5e5e5;">
                <td style="padding: 13px 8px; text-align: center;">
                    <input type="checkbox"
                           name="selected_tas[]"
                           value="aaron"
                           style="width:18px;height:18px;">
                </td>
                <td style="padding:13px 8px;font-weight:bold;">#3</td>
                <td style="padding:13px 8px;">Aaron</td>
                <td style="padding:13px 8px;">Computer Science</td>
                <td style="padding:13px 8px;">3.6</td>
                <td style="padding:13px 8px;">COP6767</td>
                <td style="padding:13px 8px;">No</td>
                <td style="padding:13px 8px;">Yes</td>
            </tr>

            <tr style="border-bottom: 1px solid #e5e5e5;">
                <td style="padding: 13px 8px; text-align: center;">
                    <input type="checkbox"

        <button type="button" style="
            background:#8BD450;
            color:white;
            border:none;
            padding:16px 50px;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
        ">
            Accept
        </button>

        <button type="button" style="
            background:#FA5757;
            color:white;
            border:none;
            padding:16px 32px;
